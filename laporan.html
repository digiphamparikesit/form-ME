<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Laporan | Monitoring ME - RSUD AM Parikesit</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/img/logo-rsud.png">
</head>
<body>

  <div class="app-layout">
    <div id="app-sidebar"></div>
    <div id="app-topbar"></div>

    <main id="app-content">

      <div class="page-header">
        <div>
          <h3 class="page-title">Data Laporan ME</h3>
          <p class="page-subtitle">Daftar semua kejadian Medication Error</p>

          <a href="input-me.html" class="btn btn-primary">
            <span>➕</span> Input ME Baru

      <div class="card">

              <tr>
                <th>No. Laporan</th>
                <th>Tgl Kejadian</th>
                <th>Pasien</th>

                <th>Status</th>

            <tbody id="tbodyLaporan">
              <tr><td colspan="8" class="text-center">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <div id="toast" class="toast" style="display:none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="assets/js/supabase-client.js"></script>
